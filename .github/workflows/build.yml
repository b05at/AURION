name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|Could not|FAILURE|> ' build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Aurion-1.0.${{ github.run_number }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Aurion 1.0.${{ github.run_number }}
          body: Automatischer Build von ${{ github.sha }}
          files: Aurion-1.0.${{ github.run_number }}.apk
          make_latest: true
